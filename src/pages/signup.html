<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Smart Parcel DropBox</title>
    <link rel="stylesheet" href="../styles/signup.css">
</head>

<body>
        
    <!--Header--->
    <main class="auth-container">
        <header class="auth-header">
            <h1>Smart Parcel Locker</h1>
            <p>Create your account to get started</p>
        </header>

        <section class="auth-card">
            <h2>Create Account</h2>
            <p class="description">Fill in your details below.</p>

            <form id="form">


                 <!--Username container--->
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="Choose a username"
                        autocomplete="username" required>
                </div>

                       <!--Password container--->
                <div class="form-group">
                    <label for="password">Password</label>

                    <div class="password-container">
                        <input type="password" id="password" name="password" placeholder="Enter your password"
                            autocomplete="new-password" required minlength="8" maxlength="16">

                        <button type="button" id="toggle-btn">Show</button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirm-password">Confirm Password</label>
                    <input type="password" id="confirm-password" name="confirm-password"
                        placeholder="Re-enter your password" autocomplete="new-password" required>
                        <p id="error-msg"> <span><img src="../assets/warning-outline-rounded.svg" alt="warning-icon"></span>Password do not match</p>
                </div>

                <button type="submit" class="submit-btn" id="submit">
                    Create Account
                </button>
            </form>

            <p class="footer-text">
                Already have an account?    
                <a href="login.html">Log in</a>
            </p>
        </section>
               <!--PopUp Message--->
    <div id="popup-container">
        <div id="popup-message">
            <p id="success-message">Account Created!</p>
            <p>Back to <a href="../pages/login.html">Login</a></p>
        </div>
        </div>
    </main>
    <script type="module" src="../javascript/signup.js"></script>
</body>

</html>
