<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Smart Parcel DropBox</title>
    <link rel="stylesheet" href="../styles/login.css">
</head>

<body>

    <main class="auth-container">
        <header class="auth-header">
            <h1>Smart Parcel DropBox</h1>
        </header>

        <section class="auth-card">
            <h2>Welcome Back</h2>
            <p class="description">Log in to your account to continue.</p>

            <form id="form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="Enter your username"
                        autocomplete="username" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <div class="password-container">
                        <input type="password" id="password" name="password" placeholder="Enter your password"
                            autocomplete="current-password" required minlength="8" maxlength="16">

                        <button type="button" id="toggle-btn">Show</button>
                    </div>
                </div>


                <button type="submit" class="submit-btn" id="submit">Log In</button>
                <p id="error-message">Invalid Username or Password</p>
            </form>

            <p class="footer-text">
                Don't have an account?
                <a href="signup.html">Sign up</a>
            </p>
        </section>
    </main>
<script type="module" src="../javascript/login.js"></script>
</body>
</html>
